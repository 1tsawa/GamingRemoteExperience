# Runtime C lié statiquement : les .exe ne dépendent plus de VCRUNTIME140.dll
# (pas besoin d'installer le « Visual C++ Redistributable » sur les PC clients).
# La crate `cc` (libopus vendorisé) suit automatiquement ce réglage (/MT).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
