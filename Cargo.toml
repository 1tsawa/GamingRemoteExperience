[workspace]
resolver = "2"
members = ["crates/grx-core", "crates/grx-host", "crates/grx-client", "crates/grx-video", "crates/grx-input", "crates/grx-audio", "crates/grx-transport", "crates/grx-render", "crates/grx-gui", "crates/grx-portmap", "crates/grx-update"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
snow = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
data-encoding = "2"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
grx-core = { path = "crates/grx-core" }
grx-update = { path = "crates/grx-update" }
# Icône + informations de version dans les .exe (build.rs de grx-gui/grx-host/grx-client)
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
