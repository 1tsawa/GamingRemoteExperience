[package]
name = "grx-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Entrées GRX : format binaire InputEvent, injection host (SendInput + ViGEm), conversion côté client"

[dependencies]
thiserror = { workspace = true }
log = "0.4"

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "0.1.4", features = ["unstable_ds4", "unstable_xtarget_notification"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
winit = "0.30"

[[example]]
name = "input_window"
path = "examples/input_window.rs"
