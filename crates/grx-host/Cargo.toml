[package]
name = "grx-host"
version.workspace = true
edition.workspace = true

[dependencies]
grx-core.workspace = true
grx-update.workspace = true
grx-transport = { path = "../grx-transport" }
grx-video = { path = "../grx-video" }
grx-audio = { path = "../grx-audio" }
grx-input = { path = "../grx-input" }
grx-portmap = { path = "../grx-portmap" }
anyhow.workspace = true
rand.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = "0.5"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Com",
] }

[build-dependencies]
winresource.workspace = true
